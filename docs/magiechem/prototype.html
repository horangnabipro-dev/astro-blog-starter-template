<title>MAGIECHEM Field Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --white:#FFFFFF; --grouped:#F7F7F8; --grouped2:#F5F5F7;
  --ink:#111111; --ink2:#6E6E73; --ink3:#8E8E93; --ink4:#AEAEB2;
  --rule:#E5E5EA; --rule2:#EFEFF1;
  --red:#EF3333; --red-soft:#FDECEC;
  --blue:#0698FF;
  --page:#E6E6E9; --page-ink:#4A4A4F;
  --tap:rgba(0,0,0,.045);
  --r-btn:12px; --r-srf:14px; --r-sheet:18px;
  --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --page:#0A0A0B; --page-ink:#8A8A90; }
}
:root[data-theme="dark"]{ --page:#0A0A0B; --page-ink:#8A8A90; }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--page);font-family:var(--font);
  -webkit-font-smoothing:antialiased;color:var(--page-ink);
  display:flex;flex-direction:column;align-items:center;min-height:100vh;
}
button{font-family:inherit;border:0;background:none;padding:0;color:inherit;cursor:pointer}
input{font-family:inherit}

/* ============ stage ============ */
.stage{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 16px 34px;width:100%}
.stage-head{text-align:center;max-width:420px}
.stage-head h1{font-size:15px;font-weight:600;color:var(--page-ink);margin:0 0 4px;letter-spacing:-.01em}
.stage-head p{font-size:13px;margin:0;opacity:.7;line-height:1.5}

.device{
  position:relative;width:393px;height:852px;background:var(--white);
  border-radius:46px;overflow:hidden;flex:0 0 auto;
  box-shadow:0 0 0 10px #1b1b1e, 0 0 0 11px #2e2e33, 0 30px 70px rgba(0,0,0,.35);
  color:var(--ink);font-size:17px;line-height:1.4;
}
@media (max-width:460px){
  .stage{padding:0}
  .stage-head{display:none}
  .device{width:100vw;height:100dvh;border-radius:0;box-shadow:none}
}

/* ============ chrome ============ */
.statusbar{
  position:absolute;top:0;left:0;right:0;height:54px;z-index:60;
  display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 30px 6px;font-size:14.5px;font-weight:600;letter-spacing:-.01em;
  pointer-events:none;color:var(--ink);
}
.statusbar .sig{display:flex;gap:5px;align-items:center;opacity:.9}
.statusbar .sig i{display:block;width:16px;height:11px;border:1.3px solid currentColor;border-radius:3px;position:relative;opacity:.85}
.statusbar .sig i::after{content:"";position:absolute;inset:1.6px;background:currentColor;border-radius:1px;right:4px}
.statusbar .bars{display:flex;align-items:flex-end;gap:1.6px;height:10px}
.statusbar .bars b{width:3px;background:currentColor;border-radius:1px}

.navbar{
  position:absolute;top:0;left:0;right:0;z-index:50;height:98px;
  padding-top:54px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0);backdrop-filter:none;
  transition:background .22s ease, backdrop-filter .22s ease, box-shadow .22s ease;
}
.navbar.solid{background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--rule)}
.navbar .nb-title{
  font-size:16.5px;font-weight:600;letter-spacing:-.015em;opacity:0;transform:translateY(4px);
  transition:opacity .2s ease,transform .2s ease;max-width:200px;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.navbar.solid .nb-title{opacity:1;transform:none}
.nb-side{position:absolute;top:54px;bottom:0;display:flex;align-items:center;gap:2px;padding:0 8px}
.nb-side.l{left:6px}.nb-side.r{right:6px}
.nb-btn{
  display:flex;align-items:center;gap:1px;height:44px;padding:0 6px;color:var(--red);
  font-size:17px;letter-spacing:-.012em;border-radius:8px;
}
.nb-btn:active{opacity:.45}
.nb-btn span{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.scroll{
  position:absolute;left:0;right:0;top:0;bottom:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;padding-top:98px;padding-bottom:104px;
  scroll-behavior:auto;
}
.scroll.nonav{padding-top:54px}
.scroll::-webkit-scrollbar{width:0}

.tabbar{
  position:absolute;left:0;right:0;bottom:0;height:83px;z-index:55;
  background:rgba(255,255,255,.9);backdrop-filter:saturate(180%) blur(20px);
  box-shadow:0 -.5px 0 var(--rule);
  display:grid;grid-template-columns:repeat(5,1fr);padding-top:7px;
}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink3);padding-top:2px}
.tab.on{color:var(--red)}
.tab svg{width:25px;height:25px}
.tab span{font-size:10.5px;font-weight:500;letter-spacing:-.005em;line-height:1.15;text-align:center;max-width:76px}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--ink);opacity:.85;z-index:70;pointer-events:none}

/* ============ primitives ============ */
.pad{padding:0 16px}
.lt{font-size:34px;font-weight:700;letter-spacing:-.032em;line-height:1.09;margin:6px 0 0}
.lt-sub{font-size:16px;color:var(--ink2);letter-spacing:-.012em;margin:5px 0 0;line-height:1.35}
.sec-label{
  font-size:12.5px;font-weight:600;letter-spacing:.065em;text-transform:uppercase;
  color:var(--ink2);margin:0 0 8px;
}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 8px}
.sec-head .more{font-size:15px;color:var(--red);letter-spacing:-.01em;flex:0 0 auto}
.body{font-size:15.5px;line-height:1.5;color:var(--ink2);letter-spacing:-.008em}
.hr{height:1px;background:var(--rule);margin:0}
.hr-in{height:1px;background:var(--rule);margin-left:16px}
.sp8{height:8px}.sp12{height:12px}.sp16{height:16px}.sp24{height:24px}.sp32{height:32px}.sp44{height:44px}

/* rows (grouped-list contexts only) */
.group{background:var(--white);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.group.inset{margin:0 16px;border:1px solid var(--rule);border-radius:var(--r-srf);overflow:hidden}
.row{
  display:flex;align-items:center;gap:12px;min-height:52px;padding:9px 16px;
  width:100%;text-align:left;position:relative;background:var(--white);
}
.row:active{background:var(--tap)}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--rule2)}
.row.hasicon+.row.hasicon::before{left:56px}
.row .ic{width:28px;flex:0 0 28px;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.row .txt{flex:1;min-width:0}
.row .t{display:block;font-size:16.5px;letter-spacing:-.014em;line-height:1.28}
.row .s{display:block;font-size:13.5px;color:var(--ink2);letter-spacing:-.006em;margin-top:2px;line-height:1.32}
.row .tail{font-size:15.5px;color:var(--ink3);letter-spacing:-.01em;flex:0 0 auto}
.row .chev{color:var(--ink4);flex:0 0 auto;display:flex}
.row.on .t{font-weight:550}
.row .check{color:var(--red);flex:0 0 auto;display:flex}

/* buttons */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;
  background:var(--red);color:#fff;font-size:17px;font-weight:600;letter-spacing:-.014em;
  border-radius:var(--r-btn);padding:0 18px;transition:opacity .14s,transform .14s;
}
.btn:active{opacity:.82;transform:scale(.988)}
.btn[disabled]{background:var(--rule);color:var(--ink4);pointer-events:none}
.btn.ghost{background:var(--grouped);color:var(--ink);font-weight:550}
.btn.plain{background:none;color:var(--red);min-height:44px;font-weight:500}
.btn.small{min-height:40px;font-size:15.5px;border-radius:10px}
.linkbtn{color:var(--red);font-size:16px;letter-spacing:-.012em;padding:12px 0;display:block;width:100%;text-align:center}

.dock{
  position:absolute;left:0;right:0;bottom:83px;z-index:45;padding:10px 16px 14px;
  background:rgba(255,255,255,.9);backdrop-filter:saturate(180%) blur(20px);
  box-shadow:0 -.5px 0 var(--rule), 0 -8px 24px rgba(0,0,0,.03);
}
.dock .hint{font-size:12.5px;color:var(--ink2);text-align:center;margin-top:8px;letter-spacing:-.004em}
.scroll.docked{padding-bottom:186px}

/* fields */
.field{
  display:flex;align-items:center;background:var(--grouped);border-radius:var(--r-btn);
  min-height:50px;padding:0 14px;gap:10px;border:1px solid transparent;transition:border-color .15s;
  min-width:0;   /* without this the input's intrinsic 20ch width pushes the row past the screen */
}
.field:focus-within{border-color:var(--red)}
.field input{
  border:0;background:none;outline:none;flex:1;width:100%;min-width:0;font-size:17px;
  color:var(--ink);letter-spacing:-.014em;
}
.field input::placeholder{color:var(--ink3)}
.searchfield{
  display:flex;align-items:center;gap:8px;background:var(--grouped);border-radius:11px;
  height:44px;padding:0 12px;color:var(--ink3);min-width:0;
}
.searchfield input{border:0;background:none;outline:none;flex:1;width:100%;min-width:0;font-size:16.5px;color:var(--ink);letter-spacing:-.012em}

.seg{display:flex;background:var(--grouped2);border-radius:10px;padding:2px;gap:2px}
.seg button{
  flex:1;min-height:36px;border-radius:8px;font-size:14.5px;font-weight:500;letter-spacing:-.008em;
  color:var(--ink);transition:background .16s,box-shadow .16s;padding:0 10px;
}
.seg button.on{background:var(--white);box-shadow:0 1px 3px rgba(0,0,0,.09);font-weight:600}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:1px solid var(--rule);border-radius:10px;padding:9px 13px;font-size:14.5px;
  letter-spacing:-.008em;color:var(--ink);background:var(--white);transition:all .15s;
  min-height:42px;display:flex;align-items:center;
}
.chip.on{border-color:var(--red);color:var(--red);background:var(--red-soft);font-weight:550}

.pill{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;letter-spacing:.03em;
  text-transform:uppercase;padding:3px 7px;border-radius:5px;background:var(--grouped);color:var(--ink2);
}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.blue{background:rgba(6,152,255,.1);color:var(--blue)}
.pill.demo{background:var(--grouped);color:var(--ink3);font-weight:500;text-transform:none;letter-spacing:0;font-size:11.5px}

/* spec pairs — product detail top block (NOT a settings list) */
.specgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}
.specgrid .cell{padding:14px 0;border-top:1px solid var(--rule2);min-width:0}
.specgrid .cell:nth-child(1),.specgrid .cell:nth-child(2){border-top:1px solid var(--rule)}
.specgrid .cell.wide{grid-column:1/-1}
.spk{font-size:12.5px;font-weight:600;letter-spacing:.055em;text-transform:uppercase;color:var(--ink2);margin-bottom:3px}
.spv{font-size:25px;font-weight:600;letter-spacing:-.022em;font-variant-numeric:tabular-nums;line-height:1.16}
.spv small{font-size:15px;font-weight:500;color:var(--ink2);letter-spacing:-.01em}
.spv.sm{font-size:19px;letter-spacing:-.016em}

/* rails */
.rail{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 4px;scroll-snap-type:x proximity}
.rail::-webkit-scrollbar{height:0}
.rail>*{scroll-snap-align:start;flex:0 0 auto}
.rcard{
  width:170px;border:1px solid var(--rule);border-radius:var(--r-srf);padding:13px 13px 12px;
  background:var(--white);text-align:left;display:flex;flex-direction:column;gap:3px;min-height:96px;
}
.rcard:active{background:var(--grouped)}
.rcard .n{font-size:16px;font-weight:650;letter-spacing:-.02em;line-height:1.22}
.rcard .d{font-size:12.5px;color:var(--ink2);line-height:1.32;letter-spacing:-.004em}
.rcard .k{font-size:11.5px;color:var(--ink3);margin-top:auto;padding-top:6px}

/* ============ SIGNATURE: coating cross-section ============ */
.xsec{display:grid;grid-template-columns:56px 1fr;gap:0;margin:0 16px}
.xdim{position:relative;border-right:1px solid var(--rule)}
.xstack{display:flex;flex-direction:column}
.xlayer{
  position:relative;display:flex;align-items:center;gap:12px;padding:0 12px 0 16px;
  text-align:left;width:100%;border-bottom:1px solid var(--rule);transition:background .16s;
  background:var(--grouped);
}
.xlayer:first-child{border-top-left-radius:6px;border-top-right-radius:6px}
.xlayer:active{background:#EDEDEF}
.xlayer .tick{
  position:absolute;left:-57px;top:50%;transform:translateY(-50%);width:56px;
  font-size:11.5px;color:var(--ink3);text-align:right;padding-right:10px;
  font-variant-numeric:tabular-nums;letter-spacing:-.004em;
}
.xlayer::after{content:"";position:absolute;left:-4px;top:-1px;width:8px;height:1px;background:var(--rule)}
.xstack{position:relative}
.xstack::after{content:"";position:absolute;left:-4px;bottom:44px;width:8px;height:1px;background:var(--rule)}
.xlayer .lnum{font-size:16.5px;font-weight:650;letter-spacing:-.018em;flex:0 0 auto}
.xlayer .lrole{font-size:13.5px;color:var(--ink2);letter-spacing:-.006em;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xlayer .lchev{color:var(--ink4);flex:0 0 auto;display:flex;opacity:.9}
.xlayer.media{
  background:
    radial-gradient(circle at 20% 30%, var(--ink4) .9px, transparent 1px),
    radial-gradient(circle at 62% 68%, var(--ink4) .9px, transparent 1px),
    radial-gradient(circle at 85% 22%, var(--ink4) .9px, transparent 1px),
    var(--grouped2);
  background-size:19px 15px,23px 18px,17px 21px,auto;
}
.xlayer.clear{background:repeating-linear-gradient(90deg,var(--grouped) 0 11px,#FBFBFC 11px 22px)}
.xsub{
  height:44px;display:flex;align-items:center;padding-left:16px;border-radius:0 0 6px 6px;
  font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);
  background:repeating-linear-gradient(45deg,#DCDCE0 0 2px,#F0F0F2 2px 7px);
}
.xnote{font-size:12.5px;color:var(--ink3);letter-spacing:-.004em;padding:10px 16px 0 72px;line-height:1.4}

/* ============ results ============ */
.resblock{padding:18px 16px;border-top:1px solid var(--rule)}
.resblock:first-of-type{border-top:1px solid var(--ink)}
.res-h{display:flex;align-items:baseline;gap:9px;margin-bottom:2px}
.res-h .num{font-size:19px;font-weight:650;letter-spacing:-.02em}
.res-h .role{font-size:13.5px;color:var(--ink2);letter-spacing:-.006em}
.res-g{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-top:11px}
.res-g .lab{font-size:12.5px;font-weight:600;letter-spacing:.055em;text-transform:uppercase;color:var(--ink2);margin-bottom:2px}
.res-g .big{font-size:27px;font-weight:650;letter-spacing:-.024em;font-variant-numeric:tabular-nums;line-height:1.1}
.res-g .big small{font-size:15px;font-weight:500;color:var(--ink2)}
.res-g .order .big{color:var(--red)}
.res-g .order{text-align:right}
.res-meta{font-size:12.5px;color:var(--ink3);margin-top:9px;letter-spacing:-.004em;line-height:1.45}
.res-sum{padding:16px;background:var(--grouped);border-radius:var(--r-srf);margin:0 16px}
.res-sum .r{display:flex;justify-content:space-between;gap:12px;font-size:14.5px;padding:4px 0;letter-spacing:-.008em}
.res-sum .r .k{color:var(--ink2)}
.res-sum .r .v{font-variant-numeric:tabular-nums;font-weight:550}

/* ============ sheets & modals ============ */
.layer{position:absolute;inset:0;z-index:80;display:none}
.layer.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.32);opacity:0;transition:opacity .28s ease}
.layer.in .scrim{opacity:1}
.sheet{
  position:absolute;left:0;right:0;bottom:0;background:var(--white);
  border-radius:var(--r-sheet) var(--r-sheet) 0 0;max-height:88%;overflow-y:auto;
  transform:translateY(100%);transition:transform .34s cubic-bezier(.32,.72,0,1);
  padding-bottom:22px;
}
.layer.in .sheet{transform:translateY(0)}
.grabber{width:36px;height:5px;border-radius:3px;background:#D2D2D7;margin:8px auto 4px}
.sheet-head{padding:8px 16px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sheet-x{
  width:30px;height:30px;border-radius:50%;background:var(--grouped2);color:var(--ink2);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.toast{
  position:absolute;left:50%;bottom:120px;transform:translate(-50%,14px);z-index:95;
  background:rgba(24,24,26,.94);color:#fff;font-size:14.5px;font-weight:500;letter-spacing:-.008em;
  padding:11px 18px;border-radius:12px;opacity:0;transition:opacity .24s,transform .24s;
  pointer-events:none;display:flex;align-items:center;gap:8px;max-width:300px;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ============ search overlay ============ */
.searchlayer{position:absolute;inset:0;z-index:58;background:var(--white);display:none;flex-direction:column}
.searchlayer.open{display:flex}
.searchlayer .sl-top{padding:60px 16px 10px;display:flex;align-items:center;gap:10px;flex:0 0 auto}
.searchlayer .sl-body{flex:1;overflow-y:auto;padding-bottom:24px}
.searchlayer .sl-body::-webkit-scrollbar{width:0}
.sl-cancel{color:var(--red);font-size:16.5px;letter-spacing:-.012em;padding:6px 2px;flex:0 0 auto}
.sl-sec{font-size:12.5px;font-weight:600;letter-spacing:.065em;text-transform:uppercase;color:var(--ink2);padding:20px 16px 7px}
mark{background:rgba(239,51,51,.16);color:inherit;border-radius:2px;padding:0 1px}

/* ============ doc viewer ============ */
.doc{padding:0 20px}
.doc h1{font-size:23px;font-weight:700;letter-spacing:-.024em;margin:0 0 3px;line-height:1.18}
.doc .dsub{font-size:14.5px;color:var(--ink2);margin:0 0 4px}
.doc h2{font-size:12.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);margin:26px 0 8px}
.doc p{font-size:14.5px;line-height:1.55;margin:0 0 10px;letter-spacing:-.004em;color:var(--ink)}
.doc .dr{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--rule2);font-size:14.5px}
.doc .dr .k{color:var(--ink2);letter-spacing:-.004em}
.doc .dr .v{font-weight:550;text-align:right;font-variant-numeric:tabular-nums}
.docbanner{
  margin:0 20px 6px;padding:9px 12px;border:1px solid var(--rule);border-radius:10px;
  font-size:12.5px;color:var(--ink2);line-height:1.4;letter-spacing:-.004em;
}

/* ============ steps / selector ============ */
.progress{display:flex;gap:5px;padding:0 16px}
.progress i{flex:1;height:3px;border-radius:2px;background:var(--rule)}
.progress i.on{background:var(--red)}
.steplabel{font-size:13.5px;color:var(--ink2);letter-spacing:-.006em;padding:12px 16px 0}
.q{font-size:26px;font-weight:650;letter-spacing:-.026em;line-height:1.18;padding:6px 16px 0;text-wrap:balance}

.matchbar{display:flex;align-items:center;gap:10px;margin-top:12px}
.matchbar .track{flex:1;height:4px;border-radius:2px;background:var(--rule);overflow:hidden}
.matchbar .track i{display:block;height:100%;background:var(--red);border-radius:2px;transition:width .5s cubic-bezier(.3,.8,.3,1)}
.matchbar .pct{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums;letter-spacing:-.004em}

.empty{padding:52px 32px;text-align:center;color:var(--ink2)}
.empty .et{font-size:17px;font-weight:600;color:var(--ink);letter-spacing:-.016em;margin-bottom:5px}
.empty .ed{font-size:14.5px;line-height:1.45;letter-spacing:-.006em}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
.fadein{animation:fi .26s ease both}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.pushin{animation:pi .3s cubic-bezier(.32,.72,0,1) both}
@keyframes pi{from{opacity:.4;transform:translateX(26px)}to{opacity:1;transform:none}}
</style>

<div class="stage">
  <div class="stage-head">
    <h1>MAGIECHEM® Field Assistant — functional prototype</h1>
    <p>Flows A–D are live. Search, browse, tap a system layer, calculate, save a project. Product values are demo data pending your TDS source file.</p>
  </div>
  <div class="device" id="device">
    <div class="statusbar">

<script>
/* =========================================================================
   CALCULATION ENGINE
   Strategy is data, not code. Each layer resolves its rule from the product
   record, optionally overridden by the system layer, then by user overrides.
   No solids term anywhere — MAGIECHEM® specifies wet film thickness.
   ========================================================================= */
const FT2_PER_GAL_MIL = 1604;   // ft² covered by 1 US gallon at 1 mil WFT
const M2_PER_FT2 = 0.09290304, L_PER_GAL = 3.785411784, KG_PER_LB = 0.45359237;

function resolveRule(layer, idx, overrides){
  const base = (P[layer.pid] && P[layer.pid].calc) || {};
  return Object.assign({}, base, layer.over || {}, (overrides && overrides[idx]) || {});
}

function computeLine(rule, areaFt2, waste, basisGal){
  const coats = rule.coats || 1;
  let theoretical = 0, unit = 'gal', how = '';
  switch(rule.method){
    case 'wft':
      theoretical = areaFt2 * rule.wft * coats / FT2_PER_GAL_MIL;
      how = rule.wft + ' mils WFT' + (coats > 1 ? ' × ' + coats + ' coats' : '');
      break;
    case 'coverage':
      theoretical = areaFt2 * coats / rule.coverage;
      how = rule.coverage + ' ft²/gal' + (coats > 1 ? ' × ' + coats + ' coats' : '');
      break;
    case 'broadcast':
      theoretical = areaFt2 * rule.rate * coats; unit = 'lb';
      how = rule.rate + ' lb/ft² broadcast';
      break;
    case 'spread':
      theoretical = areaFt2 * rule.rate * coats; unit = 'lb';
      how = rule.rate + ' lb/ft² placed';
      break;
    case 'ratio':
      theoretical = (basisGal || 0) * rule.rate; unit = 'lb';
      how = rule.rate + ' lb per gal of resin';
      break;
    default:
      return null;
  }
  const withWaste = theoretical * (1 + waste);
  const pack = rule.pack || {size:1, unit:unit, label:'unit'};
  const packs = Math.ceil((withWaste / pack.size) - 1e-9);
  return {theoretical, withWaste, unit, how, packs, pack, method:rule.method};
}

function calculateSystem(sys, areaFt2, waste, overrides){
  const lines = []; let lastGal = 0;
  sys.layers.forEach((layer, i) => {
    const rule = resolveRule(layer, i, overrides);
    const r = computeLine(rule, areaFt2, waste, lastGal);
    if(!r) return;
    if(r.unit === 'gal') lastGal = r.theoretical;
    lines.push(Object.assign({pid:layer.pid, role:layer.role, index:i}, r));
  });
  return lines;
}

function calculateProduct(prod, areaFt2, waste, overrides){
  const rule = Object.assign({}, prod.calc || {}, (overrides && overrides[0]) || {});
  const r = computeLine(rule, areaFt2, waste, 0);
  return r ? [Object.assign({pid:prod.id, role:prod.tag, index:0}, r)] : [];
}

function areaFt2(){
  const a = parseFloat(state.calc.area);
  if(!isFinite(a) || a <= 0) return 0;
  return state.calc.unit === 'm2' ? a / M2_PER_FT2 : a;
}
function currentLines(){
  const a = areaFt2(); if(!a) return [];
  const t = state.calc.target; if(!t || !t.id) return [];
  const w = state.calc.waste / 100;
  return t.kind === 'system'
    ? calculateSystem(S[t.id], a, w, state.calc.overrides)
    : calculateProduct(P[t.id], a, w, state.calc.overrides);
}

/* volume/weight display respects the entered unit system (Soulver-style unit awareness) */
function qty(v, unit){
  const metric = state.calc.unit === 'm2';
  if(unit === 'gal') return metric ? {n:v * L_PER_GAL, u:'L'} : {n:v, u:'gal'};
  return metric ? {n:v * KG_PER_LB, u:'kg'} : {n:v, u:'lb'};
}
function fmt(n, dp){
  dp = dp === undefined ? 1 : dp;
  return n.toLocaleString(state.lang === 'fr' ? 'fr-CA' : 'en-CA',
    {minimumFractionDigits:dp, maximumFractionDigits:dp});
}
function fmtArea(a, u){ return fmt(a, 0) + ' ' + (u === 'm2' ? 'm²' : 'ft²'); }

<script>

   STATE — one store above the navigation stacks, so nothing is lost on back.
   Results are DERIVED, never stored: changing area, system, waste, thickness
   or coats recomputes on read.

const state = {
  lang:'en',

  scroll:{},
  calc:{ area:'', unit:'ft2', target:null, waste:10, overrides:{}, advOpen:false, l:'', w:'' },
  selector:{ step:0, env:null, perf:[], finish:null },
  projects:[],
  recent:{ products:[], systems:[], searches:[] },
  auth:'anonymous',
  seq:1
};

/* seed one project so Continue and Projects are real on first run */
(function seed(){
  const sys = S['floor-mr1'], a = 8450, w = .10;
  state.projects.push({
    id:'p'+(state.seq++), name:'Costco Laval', client:'Costco Wholesale Canada',
    location:'Laval, QC', space:'Mechanical Room', area:a, unit:'ft2',
    systemId:sys.id, waste:10, overrides:{}, lines:calculateSystem(sys, a, w, {}),
    notes:'Existing coating to be mechanically removed. Two floor drains to be detailed.',
    created:'Today'
  });
  state.recent.products = ['9461','5076'];
  state.recent.systems = ['flake-sb'];
})();

/* ---------- navigation ---------- */
function stack(){ return state.stacks[state.tab]; }
function route(){ const s = stack(); return s[s.length - 1]; }
function push(r){ saveScroll(); stack().push(r); render('push'); }
function pop(){ if(stack().length > 1){ stack().pop(); render('pop'); } }
function setTab(tab){
  if(tab === state.tab){ if(stack().length > 1){ state.stacks[tab] = [stack()[0]]; render('pop'); } return; }
  saveScroll(); state.tab = tab; render('tab');
}
function resetTo(tab, r){ saveScroll(); state.tab = tab; state.stacks[tab] = [r]; render('tab'); }
function scrollKey(){ return state.tab + '|' + stack().map(r => r.n + (r.id||'') + (r.key||'')).join('/'); }
function saveScroll(){ state.scroll[scrollKey()] = document.getElementById('scroll').scrollTop; }

/* ---------- icons (SF-Symbols-like line set, 1.6pt) ---------- */
const IC = {

function icon(n, size, sw){
  return '<svg width="'+(size||22)+'" height="'+(size||22)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
         'stroke-width="'+(sw||1.7)+'" stroke-linecap="round" stroke-linejoin="round">'+IC[n]+'</svg>';
}
const chev = '<span class="chev">'+icon('chevR',17,2)+'</span>';

/* ---------- html helpers ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function row(o){
  const tag = o.act ? 'button' : 'div';   /* no action -> not a control */
  return '<'+tag+' class="row'+(o.icon?' hasicon':'')+(o.on?' on':'')+'" '+(o.act?'data-act="'+esc(o.act)+'"':'')+'>'+
    (o.icon ? '<span class="ic">'+icon(o.icon,21)+'</span>' : '')+
    '<span class="txt"><span class="t">'+o.t+'</span>'+(o.s?'<span class="s">'+o.s+'</span>':'')+'</span>'+
    (o.tail ? '<span class="tail">'+o.tail+'</span>' : '')+
    (o.check ? '<span class="check">'+icon('check',20,2.4)+'</span>' : (o.chev === false ? '' : chev))+
  '</'+tag+'>';
}
/* Splits "320 ft² / gal" into value + unit, but leaves "2A : 1B" and
   "A + B + Aggregate" whole. Real TDS strings drop straight in. */
function specValue(v){
  v = String(v);
  const m = v.includes(':') ? null
    : v.match(/^([<>~]?\s*\d[\d.,]*(?:\s*[\u2013\u2014-]\s*[\d.,]+)?)\s+(.+)$/);
  const big = m ? m[1].trim() : v, unit = m ? m[2].trim() : '';
  return '<div class="spv'+(big.length > 8 ? ' sm' : '')+'">'+esc(big)+
         (unit ? ' <small>'+esc(unit)+'</small>' : '')+'</div>';
}
function specCell(label, v){ return '<div class="cell"><div class="spk">'+label+'</div>'+specValue(v)+'</div>'; }
function sectionLabel(s){ return '<div class="pad"><div class="sec-label">'+s+'</div></div>'; }
function sectionLabelValue(s, v){
  return '<div class="pad"><div class="sec-head"><div class="sec-label" style="margin:0">'+s+'</div>'+
         '<div style="font-size:14px;font-weight:600;letter-spacing:-.01em;color:var(--ink)">'+esc(v)+'</div></div></div>';
}
function toast(msg){
  const el = document.getElementById('toast');
  el.innerHTML = '<span style="display:flex">'+icon('check',17,2.6)+'</span>'+esc(msg);
  const dk = document.getElementById('dock');
  el.style.bottom = (dk && dk.style.display !== 'none' ? 210 : 120) + 'px';
  el.classList.add('on'); clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('on'), 1900);
}

/* ---------- sheets ---------- */
function openSheet(html){
  const L = document.getElementById('sheetlayer');
  document.getElementById('sheet').innerHTML = '<div class="grabber"></div>'+html;
  L.classList.add('open'); requestAnimationFrame(() => L.classList.add('in'));
  bindActions(document.getElementById('sheet'));
}
function closeSheet(){
  const L = document.getElementById('sheetlayer');
  L.classList.remove('in'); setTimeout(() => L.classList.remove('open'), 300);
}

/* ---------- recents ---------- */
function touchProduct(id){ state.recent.products = [id].concat(state.recent.products.filter(x => x !== id)).slice(0,8); }
function touchSystem(id){ state.recent.systems = [id].concat(state.recent.systems.filter(x => x !== id)).slice(0,8); }

      const isSys = !!x.layers;
      return '<button class="rcard" data-act="'+(isSys?'system:':'product:')+x.id+'">'+
        '<span class="n">'+esc(isSys ? x.name : x.number)+'</span>'+
        '<span class="d">'+esc(isSys ? x.variant : x.name)+'</span>'+
        '<span class="k">'+esc(isSys ? x.thickness : (x.spec.mixRatio !== '—' ? x.spec.mixRatio : familyName(x.family)))+'</span>'+
      '</button>';
    }).join('')+'</div>';
  }

  h += '<div class="sp32"></div>';
  h += '<div class="group">'+row({icon:'book', t:t('home.docs'), s:PRODUCTS.length*2+SYSTEMS.length+' '+t('proj.files'), act:'go:docs'})+'</div>';
  h += '<div class="sp44"></div>';

};

/* ------------------------------------------------------------ PRODUCTS -- */
VIEWS.products = function(){

        .map(f => row({t:esc(f.name), tail:familyCount(f.key), act:'family:'+f.key})).join('')+'</div>';
  h += '<div class="sp44"></div>';

};

VIEWS.family = function(r){
  const list = PRODUCTS.filter(p => p.family === r.key);
  let h = '<div class="pad"><h1 class="lt">'+esc(familyName(r.key))+'</h1>'+
          '<p class="lt-sub">'+list.length+' '+t('sec.products').toLowerCase()+'</p></div>';
  h += '<div class="sp16"></div><div class="group">'+
       list.map(p => row({t:esc(p.number), s:esc(p.name), act:'product:'+p.id})).join('')+'</div>';

/* -------------------------------------------------------- PRODUCT DETAIL */
VIEWS.product = function(r){
  const p = P[r.id];
  const cells = [
    ['spec.mix', p.spec.mixRatio], ['spec.wft', p.spec.wft],
    ['spec.cov', p.spec.coverage], ['spec.work', p.spec.workingTime],
    ['spec.recoat', p.spec.recoat], ['spec.pack', p.spec.packaging]
  ].filter(c => c[1] && c[1] !== '—');

  let h = '<div class="pad">';
  h += '<div style="font-size:12.5px;font-weight:600;letter-spacing:.055em;text-transform:uppercase;color:var(--ink2)">'+esc(p.tag)+'</div>';
  h += '<h1 class="lt" style="margin-top:6px">'+esc(p.number)+'</h1>';
  h += '<p class="lt-sub" style="font-size:17px;color:var(--ink);margin-top:6px;letter-spacing:-.016em">'+esc(p.name)+'</p>';
  h += '</div><div class="sp24"></div>';

  h += '<div class="pad"><div class="specgrid">'+
       cells.map(c => specCell(t(c[0]), c[1])).join('')+'</div></div>';

  h += '<div class="sp32"></div><div class="pad"><div class="sec-label">'+t('prod.overview')+'</div>'+
       '<p class="body" style="margin:0">'+esc(p.blurb)+'</p></div>';

  if(p.uses && p.uses.length){
    h += '<div class="sp24"></div><div class="pad"><div class="sec-label">'+t('prod.uses')+'</div></div>';
    h += '<div class="pad">'+p.uses.map(u =>
      '<div style="display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule2);font-size:15.5px;letter-spacing:-.008em">'+
      '<span style="color:var(--ink4);flex:0 0 auto">—</span><span>'+esc(u)+'</span></div>').join('')+'</div>';
  }

  const using = systemsUsing(p.id);
  if(using.length){
    h += '<div class="sp32"></div>'+sectionLabel(t('prod.compatible'));
    h += '<div class="group">'+using.map(s => row({
      t:esc(s.name), s:esc(s.variant)+' · '+esc(s.thickness), act:'system:'+s.id})).join('')+'</div>';
  }

  h += '<div class="sp32"></div>'+sectionLabel(t('prod.documents'));
  h += '<div class="group">'+
    row({t:t('doc.tds'), s:esc(p.number)+' · PDF', act:'doc:tds-'+p.id, icon:'doc'})+
    row({t:t('doc.sds'), s:esc(p.number)+' · PDF', act:'doc:sds-'+p.id, icon:'doc'})+
  '</div>';
  h += '<div class="sp44"></div>';

  const canCalc = !!p.calc;
  let dock = '';
  if(canCalc){
    dock = '<button class="btn" data-act="calcproduct:'+p.id+'">'+t('prod.calc')+'</button>';
    if(using.length) dock += '<button class="btn plain" data-act="usingsheet:'+p.id+'">'+t('prod.viewSys')+'</button>';
  } else if(using.length){
    dock = '<button class="btn ghost" data-act="usingsheet:'+p.id+'">'+t('prod.viewSys')+'</button>';
  }
  return {html:h, title:p.number, dock:dock};
};

/* --------------------------------------------------------- DOC VIEWER --- */
VIEWS.doc = function(r){
  const d = D[r.id];
  const q = (r.q || '').trim();
  const hl = s => {
    s = esc(s);
    if(!q) return s;
    try{ return s.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'), '<mark>$1</mark>'); }
    catch(e){ return s; }
  };
  let body = '';
  if(d.pid){
    const p = P[d.pid];
    if(d.kind === 'TDS'){
      body =
        '<h1>'+hl(p.number)+'</h1><p class="dsub">'+hl(p.name)+'</p>'+
        '<h2>'+hl('1. Description')+'</h2><p>'+hl(p.blurb)+'</p>'+
        '<h2>'+hl('2. Recommended uses')+'</h2>'+p.uses.map(u => '<p>· '+hl(u)+'</p>').join('')+
        '<h2>'+hl('3. Technical properties')+'</h2>'+
        Object.keys(p.spec).map(k => {
          const label = {mixRatio:'Mix ratio',wft:'Wet film thickness',coverage:'Theoretical coverage',
            workingTime:'Working time at 21 °C',recoat:'Recoat window',packaging:'Packaging',voc:'VOC content'}[k] || k;
          return '<div class="dr"><span class="k">'+hl(label)+'</span><span class="v">'+hl(p.spec[k])+'</span></div>';
        }).join('')+
        '<h2>'+hl('4. Surface preparation')+'</h2>'+
        '<p>'+hl('Concrete shall be structurally sound, fully cured and free of laitance, curing compounds and previous coatings. Mechanically profile to CSP 3–4 in accordance with ICRI 310.2R. Test for moisture vapour emission per ASTM F1869 or relative humidity per ASTM F2170 prior to application.')+'</p>'+
        '<h2>'+hl('5. Mixing and application')+'</h2>'+
        '<p>'+hl('Pre-mix component A. Combine components at the stated ratio and mix for three minutes with a low-speed drill and helical blade. Scrape sides and bottom of the container. Do not aerate. Pour the mixed material onto the substrate immediately — material left in the pail will exotherm.')+'</p>'+
        '<h2>'+hl('6. Limitations')+'</h2>'+
        '<p>'+hl('Do not apply below 10 °C or above 30 °C substrate temperature. Substrate temperature must be a minimum of 3 °C above the measured dew point during application and cure. Epoxy resins amber under ultraviolet exposure; specify a UV-stable topcoat for daylight-exposed areas.')+'</p>';
    } else {
      body =
        '<h1>'+hl(p.number)+'</h1><p class="dsub">'+hl('Safety Data Sheet — '+p.name)+'</p>'+
        '<h2>'+hl('1. Identification')+'</h2>'+
        '<div class="dr"><span class="k">'+hl('Product identifier')+'</span><span class="v">'+hl(p.number)+'</span></div>'+
        '<div class="dr"><span class="k">'+hl('Recommended use')+'</span><span class="v">'+hl('Protective flooring')+'</span></div>'+
        '<div class="dr"><span class="k">'+hl('Supplier')+'</span><span class="v">MAGIECHEM®</span></div>'+
        '<h2>'+hl('2. Hazard identification')+'</h2>'+
        '<p>'+hl('Causes skin irritation. May cause an allergic skin reaction. Causes serious eye irritation. Harmful to aquatic life with long lasting effects.')+'</p>'+
        '<h2>'+hl('3. Composition')+'</h2>'+
        '<p>'+hl('Component disclosure withheld in the prototype. Full CAS breakdown appears here in the production document.')+'</p>'+
        '<h2>'+hl('4. First-aid measures')+'</h2>'+
        '<p>'+hl('Skin: wash with soap and water. Remove contaminated clothing. Eyes: rinse cautiously with water for several minutes. Remove contact lenses if present and easy to do. Continue rinsing and seek medical attention.')+'</p>'+
        '<h2>'+hl('8. Exposure controls and personal protection')+'</h2>'+
        '<p>'+hl('Chemical-resistant nitrile gloves, safety glasses with side shields, and coveralls. Provide mechanical ventilation in confined areas such as mechanical rooms, pits and tank interiors.')+'</p>';
    }
  } else {
    const s = S[d.sid];
    body = '<h1>'+hl(s.name)+'</h1><p class="dsub">'+hl(s.variant)+'</p>'+
      '<h2>'+hl('1. System description')+'</h2><p>'+hl(s.blurb)+'</p>'+
      '<h2>'+hl('2. Build-up')+'</h2>'+
      s.layers.map(l => '<div class="dr"><span class="k">'+hl(P[l.pid].number+' — '+roleName(l.role))+
        '</span><span class="v">'+hl(l.depth >= 100 ? (l.depth/1000)+' in.' : l.depth+' mils')+'</span></div>').join('')+
      '<div class="dr"><span class="k">'+hl('Nominal system thickness')+'</span><span class="v">'+hl(s.thickness)+'</span></div>'+
      '<h2>'+hl('3. Substrate requirements')+'</h2>'+
      '<p>'+hl('Minimum 25 MPa compressive strength. Profile to CSP 3–4. Moisture vapour emission rate not to exceed the limit stated in the primer technical data sheet.')+'</p>';
  }

  let h = '<div class="docbanner">'+t('doc.demo')+'</div>';
  h += '<div class="pad" style="padding-bottom:10px"><div class="searchfield">'+icon('search',17,2.1)+
       '<input id="docq" placeholder="'+t('doc.searchIn')+'" value="'+esc(q)+'" autocomplete="off"></div></div>';
  h += '<div class="doc">'+body+'</div><div class="sp44"></div>';
  return {html:h, title:d.title, rightBtn:{icon:'share', act:'share:doc'}};
};
</script>

<script>
/* ------------------------------------------------------------- SYSTEMS -- */
VIEWS.systems = function(){
  let h = '<div class="pad"><h1 class="lt">'+t('tab.systems')+'</h1></div><div class="sp16"></div>';
  h += '<div class="pad"><button class="row hasicon" data-act="go:selector" style="border:1px solid var(--rule);'+
       'border-radius:var(--r-srf);min-height:66px;padding:10px 14px">'+
       '<span class="ic" style="color:var(--red)">'+icon('wand',22)+'</span>'+
       '<span class="txt"><span class="t" style="font-size:17px;font-weight:600;letter-spacing:-.018em">'+t('sys.find')+'</span>'+
       '<span class="s" style="margin-top:2px">'+t('sys.findSub')+'</span></span>'+chev+'</button></div>';

  h += '<div class="sp32"></div>'+sectionLabel(t('sys.byApp'));
  h += '<div class="group">'+APPLICATIONS.map(a => {
    const n = SYSTEMS.filter(s => s.tags.env.includes(a.key) || s.tags.perf.includes(a.key) || s.tags.finish.includes(a.key)).length;
    return n ? row({t:esc(a.name), tail:n, act:'syslist:app|'+a.key}) : '';
  }).join('')+'</div>';

  h += '<div class="sp32"></div>'+sectionLabel(t('sys.byPerf'));
  h += '<div class="group">'+PERFORMANCE.map(pf => {
    const n = SYSTEMS.filter(s => s.tags.perf.includes(pf.key)).length;
    return n ? row({t:esc(pf.name), tail:n, act:'syslist:perf|'+pf.key}) : '';
  }).join('')+'</div>';

  h += '<div class="sp32"></div>'+sectionLabel(t('sys.all'));
  h += '<div class="group">'+SYSTEMS.map(s => row({
    t:esc(s.name), s:esc(s.variant)+' · '+esc(s.thickness), act:'system:'+s.id})).join('')+'</div>';
  h += '<div class="sp44"></div>';
  return {html:h, title:t('tab.systems')};
};

VIEWS.syslist = function(r){
  const [type, key] = r.key.split('|');
  const label = type === 'app'
    ? (APPLICATIONS.find(a => a.key === key) || {}).name
    : (PERFORMANCE.find(p => p.key === key) || {}).name;
  const list = SYSTEMS.filter(s => type === 'perf'
    ? s.tags.perf.includes(key)
    : (s.tags.env.includes(key) || s.tags.perf.includes(key) || s.tags.finish.includes(key)));
  let h = '<div class="pad"><h1 class="lt">'+esc(label)+'</h1><p class="lt-sub">'+list.length+' '+t('tab.systems').toLowerCase()+'</p></div>';
  h += '<div class="sp16"></div><div class="group">'+list.map(s => row({
    t:esc(s.name), s:esc(s.variant)+' · '+esc(s.thickness), act:'system:'+s.id})).join('')+'</div><div class="sp44"></div>';
  return {html:h, title:label};
};

/* ------------------------------------------- SYSTEM DETAIL — cross-section */
function crossSection(s){
  const maxD = Math.max.apply(null, s.layers.map(l => l.depth));
  let bands = '';
  s.layers.forEach((l, i) => {
    const p = P[l.pid];
    const hgt = Math.round(34 + 44 * Math.sqrt(l.depth / maxD));
    const tick = l.depth >= 100 ? (l.depth/1000).toFixed(2).replace(/0$/,'')+' in' : l.depth+' mils';
    const cls = l.media ? ' media' : (/clear|grout/i.test(l.role) ? ' clear' : '');
    bands += '<button class="xlayer'+cls+'" style="height:'+hgt+'px" data-act="layer:'+s.id+'|'+i+'">'+
      '<span class="tick">'+tick+'</span>'+
      '<span class="lnum">'+esc(p.number)+'</span>'+
      '<span class="lrole">'+esc(roleName(l.role))+'</span>'+
      '<span class="lchev">'+icon('chevR',15,2)+'</span>'+
    '</button>';
  });
  return '<div class="xsec"><div class="xdim"></div>'+
         '<div class="xstack">'+bands+'<div class="xsub">'+t('sys.substrate')+'</div></div></div>'+
         '<div class="xnote">'+t('sys.layerNote')+'</div>';
}

VIEWS.system = function(r){
  const s = S[r.id];
  const tagNames = s.tags.perf.map(k => (PERFORMANCE.find(x => x.key === k)||{}).name).filter(Boolean);
  let h = '<div class="pad">';
  h += '<div style="font-size:12.5px;font-weight:600;letter-spacing:.055em;text-transform:uppercase;color:var(--ink2)">'+esc(s.family)+'</div>';
  h += '<h1 class="lt" style="margin-top:6px">'+esc(s.name)+'</h1>';
  h += '<p class="lt-sub" style="font-size:17px;color:var(--ink);margin-top:5px;letter-spacing:-.016em">'+esc(s.variant)+'</p>';
  h += '<p class="body" style="margin-top:12px">'+esc(s.blurb)+'</p></div>';

  h += '<div class="sp24"></div>'+sectionLabelValue(t('sys.buildup'), s.thickness);
  h += crossSection(s);

  h += '<div class="sp32"></div><div class="pad"><div class="sec-label">'+t('sec.applications')+'</div>'+
       '<div class="chips">'+tagNames.map(n => '<span class="chip" style="pointer-events:none">'+esc(n)+'</span>').join('')+'</div></div>';

  h += '<div class="sp32"></div>'+sectionLabel(t('prod.documents'));
  h += '<div class="group">'+row({t:t('doc.guide'), s:esc(sysTitle(s))+' · PDF', act:'doc:gd-'+s.id, icon:'doc'})+
    s.layers.filter((l,i,a) => a.findIndex(x => x.pid === l.pid) === i)
      .map(l => row({t:t('doc.tds'), s:esc(P[l.pid].number)+' · PDF', act:'doc:tds-'+l.pid, icon:'doc'})).join('')+'</div>';
  h += '<div class="sp44"></div>';

  return {html:h, title:s.name,
    dock:'<button class="btn" data-act="calcsystem:'+s.id+'">'+t('sys.calc')+'</button>'};
};

/* ------------------------------------------------------- SYSTEM SELECTOR */
function scoreSystems(){
  const sel = state.selector;
  const total = 1 + sel.perf.length + 1;
  return SYSTEMS.map(s => {
    const mEnv = sel.env && s.tags.env.includes(sel.env);
    const mPerf = sel.perf.filter(k => s.tags.perf.includes(k));
    const mFin = sel.finish && s.tags.finish.includes(sel.finish);
    const matched = (mEnv?1:0) + mPerf.length + (mFin?1:0);
    return {s, pct:matched/total, mEnv, mPerf, mFin, matched};
  }).sort((a,b) => b.pct - a.pct || b.matched - a.matched);
}

VIEWS.selector = function(){
  const sel = state.selector;
  if(sel.step === 3) return VIEWS.selresult();
  const cfg = [
    {q:t('sel.q1'), hint:t('sel.one'),   opts:ENVIRONMENTS, multi:false, key:'env'},
    {q:t('sel.q2'), hint:t('sel.multi'), opts:PERFORMANCE,  multi:true,  key:'perf'},
    {q:t('sel.q3'), hint:t('sel.one'),   opts:FINISHES,     multi:false, key:'finish'}
  ][sel.step];

  let h = '<div class="progress">'+[0,1,2].map(i => '<i class="'+(i <= sel.step ? 'on' : '')+'"></i>').join('')+'</div>';
  h += '<div class="steplabel">'+t('sel.step')+' '+(sel.step+1)+' '+t('sel.of')+' 3 · '+cfg.hint+'</div>';
  h += '<div class="q">'+cfg.q+'</div><div class="sp24"></div>';
  h += '<div class="group">'+cfg.opts.map(o => {
    const on = cfg.multi ? sel.perf.includes(o.key) : sel[cfg.key] === o.key;
    return row({t:esc(o.name), on:on, check:on, chev:false, act:'seloption:'+cfg.key+'|'+o.key});
  }).join('')+'</div><div class="sp44"></div>';

  const ready = cfg.multi ? sel.perf.length > 0 : !!sel[cfg.key];
  return {html:h, title:t('sys.find'), hideNav:false,
    dock:'<button class="btn" '+(ready?'':'disabled')+' data-act="selnext">'+
         t('sel.continue')+'</button>'};
};

VIEWS.selresult = function(){
  const ranked = scoreSystems().filter(x => x.pct > 0);
  if(!ranked.length){
    return {html:'<div class="empty"><div class="et">'+t('sel.none')+'</div><div class="ed">'+t('sel.noneSub')+'</div></div>'+
      '<div class="pad"><button class="btn ghost" data-act="selreset">'+t('sel.again')+'</button></div>',
      title:t('sel.rec')};
  }
  const top = ranked[0], s = top.s;
  const reasons = [];
  if(top.mEnv) reasons.push((ENVIRONMENTS.find(e => e.key === state.selector.env)||{}).name);
  top.mPerf.forEach(k => reasons.push((PERFORMANCE.find(p => p.key === k)||{}).name));
  if(top.mFin) reasons.push((FINISHES.find(f => f.key === state.selector.finish)||{}).name);

  let h = '<div class="pad">';
  h += '<div style="font-size:12.5px;font-weight:600;letter-spacing:.055em;text-transform:uppercase;color:var(--red)">'+t('sel.rec')+'</div>';
  h += '<h1 class="lt" style="margin-top:6px">'+esc(s.name)+'</h1>';
  h += '<p class="lt-sub" style="font-size:17px;color:var(--ink);margin-top:5px;letter-spacing:-.016em">'+esc(s.variant)+'</p>';
  h += '<div class="matchbar"><div class="track"><i style="width:'+Math.round(top.pct*100)+'%"></i></div>'+
       '<div class="pct">'+Math.round(top.pct*100)+'% '+t('sel.match')+'</div></div>';
  h += '<p class="body" style="margin-top:14px">'+esc(s.blurb)+'</p></div>';

  h += '<div class="sp24"></div><div class="pad"><div class="sec-label">'+t('sel.why')+'</div>'+
       reasons.map(rn => '<div style="display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule2);font-size:15.5px;letter-spacing:-.008em">'+
       '<span style="color:var(--red);display:flex;align-items:center">'+icon('check',16,2.6)+'</span><span>'+esc(rn)+'</span></div>').join('')+'</div>';

  h += '<div class="sp24"></div>'+sectionLabelValue(t('sys.buildup'), s.thickness)+crossSection(s);

  const alts = ranked.slice(1,3);
  if(alts.length){
    h += '<div class="sp32"></div>'+sectionLabel(t('sel.alt'));
    h += '<div class="group">'+alts.map(a => row({
      t:esc(a.s.name), s:esc(a.s.variant), tail:Math.round(a.pct*100)+'%', act:'system:'+a.s.id})).join('')+'</div>';
  }
  h += '<div class="pad" style="padding-top:18px"><button class="btn plain" data-act="selreset">'+t('sel.again')+'</button></div>';
  h += '<div class="sp44"></div>';

  return {html:h, title:t('sel.rec'),
    dock:'<button class="btn" data-act="calcsystem:'+s.id+'">'+t('sel.calc')+'</button>'+
         '<button class="btn plain" data-act="system:'+s.id+'">'+t('sel.view')+'</button>'};
};
</script>

<script>
/* ---------------------------------------------------------- CALCULATOR -- */
function targetLabel(){
  const tg = state.calc.target; if(!tg || !tg.id) return null;
  return tg.kind === 'system' ? {t:S[tg.id].name, s:S[tg.id].variant} : {t:P[tg.id].number, s:P[tg.id].name};
}

function previewHTML(){
  const lines = currentLines();
  if(!areaFt2()) return '<div class="empty" style="padding:34px 32px"><div class="ed">'+t('calc.enterArea')+'</div></div>';
  if(!lines.length) return '<div class="empty" style="padding:34px 32px"><div class="ed">'+t('calc.pickSystem')+'</div></div>';
  return '<div class="pad"><div class="sec-head"><div class="sec-label" style="margin:0">'+t('res.title')+'</div>'+
    '<div style="font-size:12px;color:var(--ink3);letter-spacing:-.004em">'+t('calc.live')+'</div></div></div>'+
    '<div class="group">'+lines.map(l => {
      const q = qty(l.withWaste, l.unit);
      return row({t:esc(P[l.pid].number), s:esc(roleName(l.role)),
        tail:'<span style="font-variant-numeric:tabular-nums"><b style="color:var(--ink);font-weight:600">'+
             l.packs+'</b> '+esc(packWord(l.pack.label, l.packs))+'</span>',
        chev:false});
    }).join('')+'</div>';
}

VIEWS.calc = function(){
  const c = state.calc, tl = targetLabel();
  let h = '<div class="pad"><h1 class="lt">'+t('tab.calculator')+'</h1></div><div class="sp24"></div>';

  h += '<div class="pad"><div class="sec-label">'+t('calc.area')+'</div>'+

function refreshCalc(){
  const pv = document.getElementById('calcpreview');
  if(pv){ pv.innerHTML = previewHTML(); bindActions(pv); }
  const dk = document.querySelector('#dock .btn');
  if(dk){ if(areaFt2() > 0 && state.calc.target && state.calc.target.id) dk.removeAttribute('disabled'); else dk.setAttribute('disabled',''); }
}
function bindCalcInputs(){
  const a = document.getElementById('areaIn'), l = document.getElementById('lIn'), w = document.getElementById('wIn');
  if(a){
    a.addEventListener('focus', () => { a.value = state.calc.area; });
    a.addEventListener('blur', () => {
      const n = parseFloat(state.calc.area);
      if(isFinite(n) && n > 0) a.value = fmt(n, n % 1 ? 2 : 0);
    });
    const n0 = parseFloat(state.calc.area);
    if(isFinite(n0) && n0 > 0 && document.activeElement !== a) a.value = fmt(n0, n0 % 1 ? 2 : 0);
  }
  if(a) a.addEventListener('input', e => {
    state.calc.area = e.target.value.replace(/[^\d.]/g,'');
    state.calc.l = ''; state.calc.w = '';
    if(l) l.value = ''; if(w) w.value = '';
    refreshCalc();
  });
  const dim = () => {
    state.calc.l = l.value.replace(/[^\d.]/g,''); state.calc.w = w.value.replace(/[^\d.]/g,'');
    const L = parseFloat(state.calc.l), W = parseFloat(state.calc.w);
    if(isFinite(L) && isFinite(W) && L > 0 && W > 0){
      state.calc.area = String(Math.round(L * W * 100) / 100);
      if(a) a.value = state.calc.area;
      refreshCalc();
    }
  };
  if(l) l.addEventListener('input', dim);
  if(w) w.addEventListener('input', dim);
}

/* pickers */
VIEWS.pick = function(r){
  const isSys = r.key === 'system';
  const q = (r.q || '').toLowerCase();
  const items = isSys
    ? SYSTEMS.filter(s => !q || (s.name+' '+s.variant+' '+s.family).toLowerCase().includes(q))
    : PRODUCTS.filter(p => p.calc).filter(p => !q || (p.number+' '+p.name).toLowerCase().includes(q));

  let h = '<div class="pad"><h1 class="lt">'+(isSys?t('calc.pickSystem'):t('calc.pickProduct'))+'</h1></div><div class="sp16"></div>';
  h += '<div class="pad"><div class="searchfield"><span style="display:flex">'+icon('search',17,2.1)+'</span>'+
       '<input id="pickq" placeholder="'+(isSys?t('calc.search'):t('calc.pickProduct'))+'" value="'+esc(r.q||'')+'" autocomplete="off"></div></div>';

  if(isSys && state.recent.systems.length && !q){
    h += '<div class="sp24"></div>'+sectionLabel(t('calc.recent'));
    h += '<div class="group">'+state.recent.systems.map(id => S[id]).filter(Boolean).map(s => row({
      t:esc(s.name), s:esc(s.variant), act:'settarget:system|'+s.id,
      on:cur&&cur.id===s.id, check:cur&&cur.id===s.id, chev:!(cur&&cur.id===s.id)})).join('')+'</div>';
  }

  h += '<div class="group">'+(items.length ? items.map(x => row({
    t:esc(isSys?x.name:x.number), s:esc(isSys?x.variant:x.name),
    act:'settarget:'+(isSys?'system':'product')+'|'+x.id,
    on:cur&&cur.id===x.id, check:cur&&cur.id===x.id, chev:!(cur&&cur.id===x.id)
  })).join('') : '<div class="empty"><div class="ed">'+t('search.none')+'</div></div>')+'</div><div class="sp44"></div>';
  return {html:h, title:isSys?t('calc.pickSystem'):t('calc.pickProduct')};

/* advanced settings sheet — edits the rule, not the result */
function advancedSheet(){
  const tg = state.calc.target; if(!tg) return;
  const layers = tg.kind === 'system'
    ? S[tg.id].layers.map((l,i) => ({l, i, p:P[l.pid]}))
    : [{l:{pid:tg.id, role:P[tg.id].tag}, i:0, p:P[tg.id]}];

  let h = '<div class="sheet-head"><div><div style="font-size:20px;font-weight:650;letter-spacing:-.022em">'+t('calc.advanced')+'</div>'+
          '<div style="font-size:13.5px;color:var(--ink2);margin-top:2px">'+t('calc.advSub')+'</div></div>'+
          '<button class="sheet-x" data-act="closesheet">'+icon('x',15,2.2)+'</button></div><div class="sp16"></div>';

  layers.forEach(({l, i, p}) => {
    const rule = resolveRule(l, i, state.calc.overrides);
    let fields = '';
    const f = (lab, key, val, suffix) =>
      '<div style="flex:1;min-width:0"><div class="spk" style="margin-bottom:5px">'+lab+'</div>'+
      '<div class="field" style="min-height:44px"><input inputmode="decimal" data-ov="'+i+'|'+key+'" value="'+val+'" '+
      'style="font-size:17px;font-weight:550;font-variant-numeric:tabular-nums">'+
      (suffix?'<span style="color:var(--ink2);font-size:13.5px;flex:0 0 auto">'+suffix+'</span>':'')+'</div></div>';
    if(rule.method === 'wft')       fields = f(t('calc.wft'), 'wft', rule.wft, 'mils');
    else if(rule.method === 'coverage') fields = f(t('calc.cov'), 'coverage', rule.coverage, 'ft²/gal');
    else if(rule.method === 'broadcast' || rule.method === 'spread') fields = f(t('calc.rate'), 'rate', rule.rate, 'lb/ft²');
    fields += f(t('calc.coats'), 'coats', rule.coats || 1, '');

    h += '<div style="padding:14px 16px;border-top:1px solid var(--rule2)">'+
      '<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:10px">'+
        '<span style="font-size:16.5px;font-weight:650;letter-spacing:-.018em">'+esc(p.number)+'</span>'+
        '<span style="font-size:13.5px;color:var(--ink2)">'+esc(roleName(l.role))+'</span>'+
        '<span class="pill" style="margin-left:auto">'+rule.method+'</span>'+
      '</div><div style="display:flex;gap:12px">'+fields+'</div></div>';
  });
  h += '<div class="pad" style="padding-top:18px"><button class="btn ghost" data-act="resetov">'+t('calc.reset')+'</button></div>';
  openSheet(h);
  document.getElementById('sheet').querySelectorAll('input[data-ov]').forEach(inp => {
    inp.addEventListener('input', e => {
      const [i, key] = e.target.dataset.ov.split('|');
      const v = parseFloat(e.target.value.replace(/[^\d.]/g,''));
      state.calc.overrides[i] = state.calc.overrides[i] || {};
      if(isFinite(v) && v > 0) state.calc.overrides[i][key] = key === 'coats' ? Math.round(v) : v;
      else delete state.calc.overrides[i][key];
      refreshCalc();
    });
  });
}

/* ------------------------------------------------------------- RESULTS -- */
VIEWS.results = function(){
  const lines = currentLines(), c = state.calc, tl = targetLabel();
  let h = '<div class="pad"><h1 class="lt">'+t('res.title')+'</h1>'+
          '<p class="lt-sub">'+fmtArea(parseFloat(c.area)||0, c.unit)+' · '+esc(tl ? tl.t : '')+'</p></div>';
  h += '<div class="sp24"></div>';

  h += lines.map(l => {
    const req = qty(l.withWaste, l.unit), theo = qty(l.theoretical, l.unit);
    return '<div class="resblock">'+
      '<div class="res-h"><span class="num">'+esc(P[l.pid].number)+'</span><span class="role">'+esc(roleName(l.role))+'</span></div>'+
      '<div class="res-g">'+
        '<div><div class="lab">'+t('res.req')+'</div><div class="big">'+fmt(req.n,1)+' <small>'+req.u+'</small></div></div>'+
        '<div class="order"><div class="lab">'+t('res.order')+'</div><div class="big">'+l.packs+' <small>'+
          esc(packWord(l.pack.label, l.packs))+'</small></div></div>'+
      '</div>'+
      '<div class="res-meta">'+t('res.theo')+' '+fmt(theo.n,1)+' '+theo.u+' · '+esc(l.how)+' · '+
        esc(l.pack.size+' '+l.pack.unit+' '+packWord(l.pack.label, 1))+'</div>'+
    '</div>';
  }).join('');

  h += '<div class="sp32"></div>'+sectionLabel(t('res.summary'));
  const packTotals = {};
  lines.forEach(l => { packTotals[l.pack.label] = (packTotals[l.pack.label]||0) + l.packs; });
  h += '<div class="res-sum">'+
    '<div class="r"><span class="k">'+t('res.totalArea')+'</span><span class="v">'+fmtArea(parseFloat(c.area)||0, c.unit)+'</span></div>'+
    '<div class="r"><span class="k">'+t('proj.system')+'</span><span class="v">'+esc(tl?tl.t:'')+'</span></div>'+
    '<div class="r"><span class="k">'+t('res.layers')+'</span><span class="v">'+lines.length+'</span></div>'+
    '<div class="r"><span class="k">'+t('calc.waste')+'</span><span class="v">'+c.waste+'%</span></div>'+
    Object.keys(packTotals).map(k => { const w = packWord(k, 2);
      return '<div class="r"><span class="k">'+esc(w.charAt(0).toUpperCase()+w.slice(1))+'</span>'+
      '<span class="v">'+packTotals[k]+'</span></div>'; }).join('')+
  '</div>';
  h += '<div class="sp44"></div>';

  return {html:h, title:t('res.title'),
    dock:'<button class="btn" data-act="savetoproject">'+t('res.save')+'</button>'+
         '<button class="btn plain" data-act="share:materials">'+t('res.share')+'</button>'};
};

  let h = '<div class="sheet-head"><div><div style="font-size:22px;font-weight:700;letter-spacing:-.024em">'+t('auth.title')+'</div></div>'+
          '<button class="sheet-x" data-act="closesheet">'+icon('x',15,2.2)+'</button></div>';
  h += '<div class="pad" style="padding-top:8px"><p class="body" style="margin:0">'+t('auth.body')+'</p></div>';
  h += '<div class="sp24"></div><div class="pad" style="display:flex;flex-direction:column;gap:10px">'+
    '<button class="btn" style="background:#111" data-act="auth:'+next+'">'+t('auth.apple')+'</button>'+
    '<button class="btn ghost" data-act="auth:'+next+'">'+t('auth.google')+'</button>'+
    '<button class="btn ghost" data-act="auth:'+next+'">'+t('auth.email')+'</button>'+
    '<button class="btn plain" data-act="closesheet">'+t('auth.not')+'</button>'+
  '</div>';
  openSheet(h);
}

function nameSheet(){
  const tl = targetLabel();
  const suggested = tl ? tl.t.replace(/™|®/g,'') + ' — ' + fmtArea(parseFloat(state.calc.area)||0, state.calc.unit) : '';
  let h = '<div class="sheet-head"><div><div style="font-size:22px;font-weight:700;letter-spacing:-.024em">'+t('proj.save')+'</div></div>'+
          '<button class="sheet-x" data-act="closesheet">'+icon('x',15,2.2)+'</button></div>';
  h += '<div class="sp16"></div><div class="pad" style="display:flex;flex-direction:column;gap:12px">'+
    '<div><div class="spk" style="margin-bottom:6px">'+t('proj.name')+'</div>'+
      '<div class="field"><input id="pname" value="'+esc(suggested)+'" autocomplete="off"></div></div>'+
    '<div><div class="spk" style="margin-bottom:6px">'+t('proj.client')+'</div>'+
      '<div class="field"><input id="pclient" placeholder="—" autocomplete="off"></div></div>'+
    '<div><div class="spk" style="margin-bottom:6px">'+t('proj.loc')+'</div>'+
      '<div class="field"><input id="ploc" placeholder="—" autocomplete="off"></div></div>'+
    '<button class="btn" data-act="commitsave">'+t('proj.save')+'</button>'+
  '</div>';
  openSheet(h);
  setTimeout(() => { const el = document.getElementById('pname'); if(el) el.focus(); }, 340);
}
</script>

<script>
/* ------------------------------------------------------- UNIVERSAL SEARCH */
const SUGGESTIONS = ['9461','chemical resistant','flake','ESD','mechanical room','parking','moisture'];

function searchAll(q){
  q = q.trim().toLowerCase();
  if(!q) return null;
  const hay = x => x.toLowerCase().includes(q);
  const products = PRODUCTS.filter(p =>
    hay(p.number) || hay(p.name) || hay(p.tag) || hay(p.blurb) || p.uses.some(hay) || hay(familyName(p.family)));
  const systems = SYSTEMS.filter(s =>
    hay(s.name) || hay(s.variant) || hay(s.family) || hay(s.blurb) ||
    s.tags.perf.some(k => hay((PERFORMANCE.find(x => x.key === k)||{}).name || '')) ||
    s.tags.env.some(k => hay((ENVIRONMENTS.find(x => x.key === k)||{}).name || '')) ||
    s.tags.finish.some(k => hay((FINISHES.find(x => x.key === k)||{}).name || '')));
  const docs = DOCUMENTS.filter(d => hay(d.title));
  const exact = PRODUCTS.filter(p => p.number.toLowerCase() === q || p.number.toLowerCase().startsWith(q));
  const using = exact.length ? systemsUsing(exact[0].id).filter(s => !systems.includes(s)) : [];
  return {products, systems, docs, using, exactProduct:exact[0]};
}

function renderSearch(){
  const q = document.getElementById('sinput').value;
  const body = document.getElementById('sbody');
  const res = searchAll(q);
  if(!res){
    let h = '';
    if(state.recent.searches.length){
      h += '<div class="sl-sec">'+t('search.recent')+'</div><div class="group">'+
        state.recent.searches.map(s => row({icon:'clock', t:esc(s), act:'dosearch:'+encodeURIComponent(s), chev:false})).join('')+'</div>';
    }
    h += '<div class="sl-sec">'+t('sec.suggested')+'</div><div class="pad"><div class="chips">'+
      SUGGESTIONS.map(s => '<button class="chip" data-act="dosearch:'+encodeURIComponent(s)+'">'+esc(s)+'</button>').join('')+'</div></div>';
    body.innerHTML = h; bindActions(body); return;
  }
  let h = '';
  if(res.products.length){
    h += '<div class="sl-sec">'+(res.products.length === 1 ? t('sec.product') : t('sec.products'))+'</div><div class="group">'+
      res.products.map(p => row({t:esc(p.number), s:esc(p.name), act:'search2product:'+p.id})).join('')+'</div>';
  }
  if(res.using.length){
    h += '<div class="sl-sec">'+t('sec.using')+'</div><div class="group">'+
      res.using.map(s => row({t:esc(s.name), s:esc(s.variant), act:'search2system:'+s.id})).join('')+'</div>';
  }
  if(res.systems.length){
    h += '<div class="sl-sec">'+t('sec.systems')+'</div><div class="group">'+
      res.systems.map(s => row({t:esc(s.name), s:esc(s.variant)+' · '+esc(s.thickness), act:'search2system:'+s.id})).join('')+'</div>';
  }
  if(res.docs.length){
    h += '<div class="sl-sec">'+t('sec.documents')+'</div><div class="group">'+
      res.docs.slice(0,8).map(d => row({icon:'doc', t:esc(d.title), act:'search2doc:'+d.id})).join('')+'</div>';
  }
  if(!h) h = '<div class="empty"><div class="et">'+t('search.none')+'</div><div class="ed">'+t('search.noneSub')+'</div></div>';
  body.innerHTML = h + '<div class="sp44"></div>';
  bindActions(body);
}
function openSearch(){
  const L = document.getElementById('searchlayer');
  const i = document.getElementById('sinput');
  i.placeholder = t('home.ph'); document.getElementById('scancel').textContent = t('search.cancel');
  L.classList.add('open'); renderSearch();
  setTimeout(() => i.focus(), 40);
}
function closeSearch(){
  document.getElementById('searchlayer').classList.remove('open');
  document.getElementById('sinput').value = '';
}
function rememberSearch(){
  const q = document.getElementById('sinput').value.trim();
  if(q) state.recent.searches = [q].concat(state.recent.searches.filter(x => x !== q)).slice(0,5);
}

/* -------------------------------------------------------------- RENDER -- */
function titleFor(r){
  switch(r.n){
    case 'home': return t('tab.home');
    case 'products': return t('tab.products');
    case 'family': return familyName(r.key);
    case 'product': return P[r.id].number;
    case 'doc': return D[r.id].kind === 'TDS' ? t('doc.tds') : D[r.id].kind === 'SDS' ? t('doc.sds') : t('doc.guide');
    case 'systems': return t('tab.systems');
    case 'syslist': { const [ty,k] = r.key.split('|');
      return ((ty === 'app' ? APPLICATIONS : PERFORMANCE).find(x => x.key === k) || {}).name || t('tab.systems'); }
    case 'system': return S[r.id].name;
    case 'selector': return state.selector.step === 3 ? t('sel.rec') : t('sys.find');
    case 'calc': return t('tab.calculator');
    case 'pick': return r.key === 'system' ? t('calc.pickSystem') : t('calc.pickProduct');
    case 'results': return t('res.title');
    case 'projects': return t('tab.projects');
    case 'project': { const p = state.projects.find(x => x.id === r.id); return p ? p.name : t('tab.projects'); }
    case 'materials': return t('proj.matList');
    case 'projdocs': return t('proj.docs');
    case 'docs': return t('doc.center');
    case 'doclist': return {tds:t('doc.tds'), sds:t('doc.sds'), guide:t('doc.guide')}[r.key];
    case 'settings': return t('set.title');
  }
  return '';
}

const TABICONS = {home:'home', systems:'layers', calculator:'calc', products:'grid', projects:'folder'};

function renderTabs(){
  document.getElementById('tabbar').innerHTML = TABS.map(tb =>
    '<button class="tab'+(state.tab === tb ? ' on' : '')+'" data-act="tab:'+tb+'">'+
    icon(TABICONS[tb], 25, state.tab === tb ? 1.9 : 1.7)+'<span>'+t('tab.'+tb)+'</span></button>').join('');
  bindActions(document.getElementById('tabbar'));
}

function render(mode){
  const r = route(), v = VIEWS[r.n](r);
  const sc = document.getElementById('scroll'), nav = document.getElementById('navbar');
  const dock = document.getElementById('dock');

  document.getElementById('nbtitle').textContent = v.title || '';
  const inSelector = r.n === 'selector' && state.selector.step > 0;
  const back = stack().length > 1 || inSelector;
  const backLabel = inSelector
    ? t('sel.step') + ' ' + state.selector.step
    : (stack().length > 1 ? titleFor(stack()[stack().length-2]) : '');
  document.getElementById('nbleft').innerHTML = back
    ? '<button class="nb-btn" data-act="back">'+icon('chevL',20,2.2)+'<span>'+esc(backLabel)+'</span></button>'
    : '';
  document.getElementById('nbright').innerHTML = v.rightBtn
    ? '<button class="nb-btn" data-act="'+v.rightBtn.act+'">'+icon(v.rightBtn.icon,21,1.8)+'</button>'
    : '';
  nav.style.display = v.hideNav && !back ? 'none' : '';
  sc.classList.toggle('nonav', !!(v.hideNav && !back));

  if(v.dock){ dock.style.display = ''; dock.innerHTML = v.dock; sc.classList.add('docked'); }
  else { dock.style.display = 'none'; dock.innerHTML = ''; sc.classList.remove('docked'); }

  sc.innerHTML = '<div class="'+(mode === 'push' ? 'pushin' : 'fadein')+'">'+v.html+'</div>';
  sc.scrollTop = mode === 'pop' ? (state.scroll[scrollKey()] || 0) : 0;
  nav.classList.toggle('solid', sc.scrollTop > 12);

  renderTabs();
  bindActions(sc); bindActions(dock); bindActions(document.getElementById('navbar'));
  if(r.n === 'calc') bindCalcInputs();
  bindInlineSearch();
}

function bindInlineSearch(){
  const dq = document.getElementById('docq');
  if(dq) dq.addEventListener('input', e => {
    route().q = e.target.value; const pos = e.target.selectionStart; render();
    const el = document.getElementById('docq'); if(el){ el.focus(); el.setSelectionRange(pos,pos); }
  });
  const pq = document.getElementById('pickq');
  if(pq) pq.addEventListener('input', e => {
    route().q = e.target.value; const pos = e.target.selectionStart; render();
    const el = document.getElementById('pickq'); if(el){ el.focus(); el.setSelectionRange(pos,pos); }
  });
}

/* ------------------------------------------------------------- ACTIONS -- */
function bindActions(root){
  if(!root) return;
  root.querySelectorAll('[data-act]').forEach(el => {
    if(el._bound) return; el._bound = 1;
    el.addEventListener('click', ev => { ev.preventDefault(); doAction(el.dataset.act); });
  });
}

function doAction(a){
  const i = a.indexOf(':');
  const k = i < 0 ? a : a.slice(0, i);
  const v = i < 0 ? '' : a.slice(i + 1);
  const A = {
    noop(){},
    back(){
      const r = route();
      if(r.n === 'selector' && state.selector.step > 0){ state.selector.step--; render('pop'); return; }
      pop();
    },
    tab(){ setTab(v); },
    search(){ openSearch(); },
    closesheet(){ closeSheet(); },
    dosearch(){ document.getElementById('sinput').value = decodeURIComponent(v); renderSearch(); },
    go(){
      if(v === 'settings') push({n:'settings'});
      else if(v === 'selector'){ state.selector = {step:0, env:null, perf:[], finish:null}; push({n:'selector'}); }
      else if(v === 'calc') setTab('calculator');
      else if(v === 'products') setTab('products');
      else if(v === 'docs') push({n:'docs'});
      else if(v === 'results') push({n:'results'});
    },
    product(){ touchProduct(v); push({n:'product', id:v}); },
    family(){ push({n:'family', key:v}); },
    doc(){ push({n:'doc', id:v, q:''}); },
    system(){ touchSystem(v); closeSheet(); push({n:'system', id:v}); },
    syslist(){ push({n:'syslist', key:v}); },
    doclist(){ push({n:'doclist', key:v}); },
    docs(){ push({n:'docs'}); },
    layer(){ const [sid, idx] = v.split('|'); layerSheet(sid, +idx); },
    sheetproduct(){ closeSheet(); touchProduct(v); push({n:'product', id:v}); },
    usingsheet(){
      const list = systemsUsing(v);
      openSheet('<div class="sheet-head"><div style="font-size:20px;font-weight:650;letter-spacing:-.022em">'+t('sec.using')+'</div>'+
        '<button class="sheet-x" data-act="closesheet">'+icon('x',15,2.2)+'</button></div><div class="sp16"></div>'+
        '<div class="group">'+list.map(s => row({t:esc(s.name), s:esc(s.variant), act:'system:'+s.id})).join('')+'</div>');
    },
    search2product(){ rememberSearch(); closeSearch(); touchProduct(v); push({n:'product', id:v}); },
    search2system(){ rememberSearch(); closeSearch(); touchSystem(v); push({n:'system', id:v}); },
    search2doc(){ rememberSearch(); closeSearch(); push({n:'doc', id:v, q:''}); },
    seloption(){
      const [key, val] = v.split('|');
      if(key === 'perf'){
        state.selector.perf = state.selector.perf.includes(val)
          ? state.selector.perf.filter(x => x !== val) : state.selector.perf.concat([val]);
      } else state.selector[key] = val;
      render();
    },
    selnext(){ state.selector.step++; render('push'); },
    selreset(){ state.selector = {step:0, env:null, perf:[], finish:null}; render(); },
    calcsystem(){
      touchSystem(v); closeSheet();
      state.calc.target = {kind:'system', id:v}; state.calc.overrides = {};
      resetTo('calculator', {n:'calc'});
    },
    calcproduct(){
      touchProduct(v);
      state.calc.target = {kind:'product', id:v}; state.calc.overrides = {};
      resetTo('calculator', {n:'calc'});
    },
    unit(){
      if(state.calc.unit !== v && state.calc.area){
        const a = parseFloat(state.calc.area);
        if(isFinite(a)) state.calc.area = String(Math.round((v === 'm2' ? a * M2_PER_FT2 : a / M2_PER_FT2) * 100) / 100);
      }
      state.calc.unit = v; state.calc.l = ''; state.calc.w = ''; render();
    },
    kind(){
      if(!state.calc.target || state.calc.target.kind !== v){ state.calc.target = null; state.calc.overrides = {}; }
      state.calc.target = state.calc.target || {kind:v, id:null};
      state.calc.target.kind = v;
      if(!state.calc.target.id) push({n:'pick', key:v, q:''}); else render();
    },
    pick(){ push({n:'pick', key:v, q:''}); },
    settarget(){
      const [kind, id] = v.split('|');
      state.calc.target = {kind, id}; state.calc.overrides = {};
      if(kind === 'system') touchSystem(id); else touchProduct(id);
      pop();
    },
    waste(){ state.calc.waste = +v; render(); },
    advanced(){ advancedSheet(); },
    resetov(){ state.calc.overrides = {}; refreshCalc(); advancedSheet(); toast(t('calc.reset')); },
    savetoproject(){ if(state.auth === 'anonymous') authSheet('save'); else nameSheet(); },
    auth(){ state.auth = 'account'; closeSheet(); setTimeout(nameSheet, 320); },
    commitsave(){
      const nm = (document.getElementById('pname')||{}).value || 'Untitled project';
      const cl = (document.getElementById('pclient')||{}).value || '';
      const lo = (document.getElementById('ploc')||{}).value || '';
      const tl = targetLabel();
      const p = {
        id:'p'+(state.seq++), name:nm.trim(), client:cl.trim(), location:lo.trim(),
        space:'', area:parseFloat(state.calc.area)||0, unit:state.calc.unit,
        systemId:state.calc.target.kind === 'system' ? state.calc.target.id : null,
        productId:state.calc.target.kind === 'product' ? state.calc.target.id : null,
        waste:state.calc.waste, overrides:JSON.parse(JSON.stringify(state.calc.overrides)),
        lines:currentLines(), notes:'', created:t('proj.today')
      };
      if(!p.systemId){ closeSheet(); toast('Product-only projects come next'); return; }
      state.projects.unshift(p); closeSheet();
      setTimeout(() => { resetTo('projects', {n:'projects'}); push({n:'project', id:p.id}); toast(t('proj.saved')); }, 260);
    },
    project(){ push({n:'project', id:v}); },
    materials(){ push({n:'materials', id:v}); },
    projdocs(){ push({n:'projdocs', id:v}); },
    reopen(){
      const p = state.projects.find(x => x.id === v); if(!p) return;
      state.calc.area = String(p.area); state.calc.unit = p.unit; state.calc.waste = p.waste;
      state.calc.target = {kind:'system', id:p.systemId};
      state.calc.overrides = JSON.parse(JSON.stringify(p.overrides || {}));
      resetTo('calculator', {n:'calc'}); push({n:'results'});
    },
    share(){ toast(v === 'doc' ? t('doc.share') : t('res.share')); },
    lang(){ state.lang = v; render(); },
    authsheet(){ authSheet('none'); }
  };
  (A[k] || A.noop)();
}

/* --------------------------------------------------------------- BOOT --- */
document.getElementById('scroll').addEventListener('scroll', e => {
  document.getElementById('navbar').classList.toggle('solid', e.target.scrollTop > 12);
});
document.getElementById('sinput').addEventListener('input', renderSearch);
render();
</script>

<script>
/* =========================================================================
   FINISH ART — coating finishes painted on canvas.
   Real coatings are textures, so the imagery is generated from the finish
   definition rather than shipped as photographs. Deterministic, so a given
   finish looks the same every render. Swap paintFinish() for <img> when
   MAGIECHEM® supplies photography and the colour / flake / quartz charts.
   ========================================================================= */
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const COLOURWAYS = {
  flake:[
    {n:'Granite',    base:'#9E9C99', chips:['#565B62','#D7D4CF','#7E8288','#F0EEEA']},
    {n:'Sandstone',  base:'#B5AA98', chips:['#89795F','#E4DBCA','#6D6252','#F2ECE0']},
    {n:'Slate',      base:'#8E969E', chips:['#4B5763','#CAD1D7','#6B7783','#E9EDF0']},
    {n:'Terracotta', base:'#A6928D', chips:['#8B4034','#DDD3D0','#5D4A47','#EFE7E4']}
  ],
  quartz:[
    {n:'Desert',  base:'#C0B49F', chips:['#998970','#E4DAC7','#796B54']},
    {n:'Pewter',  base:'#A9A8A5', chips:['#7A7977','#DAD9D6','#5F5F5F']},
    {n:'Marine',  base:'#92A0A6', chips:['#5E7079','#C7D1D5','#405159']},
    {n:'Wheat',   base:'#C9BEA6', chips:['#A79濃'.slice(0,7),'#EDE5D4','#8A7C60']}
  ],
  smooth:[
    {n:'Light Grey', base:'#B9BCBE'}, {n:'Charcoal', base:'#4E5256'},
    {n:'Sand',       base:'#C6BCA6'}, {n:'Tile Red', base:'#8E5D55'}
  ],
  cementitious:[
    {n:'Buff',  base:'#B4AA9C'}, {n:'Grey',  base:'#A2A19E'},
    {n:'Green', base:'#8D9A8E'}, {n:'Red',   base:'#9A6558'}
  ],
  traffic:[
    {n:'Deck Grey', base:'#7E838A', chips:['#61666C','#9AA0A6']},
    {n:'Charcoal',  base:'#5C6167', chips:['#484D53','#7E848A']}
  ]
};
COLOURWAYS.quartz[3] = {n:'Wheat', base:'#C9BEA6', chips:['#A7936F','#EDE5D4','#8A7C60']};

const FINISHES_ART = [
  {key:'flake',        name:'Flake',         sub:'Decorative broadcast'},
  {key:'quartz',       name:'Quartz',        sub:'Double broadcast'},
  {key:'smooth',       name:'Smooth',        sub:'Self-levelling'},
  {key:'cementitious', name:'Cementitious',  sub:'Urethane mortar'}
];

function paintFinish(cv, kind, cwIndex){
  const set = COLOURWAYS[kind] || COLOURWAYS.smooth;
  const cw = set[(cwIndex || 0) % set.length];
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = cv.clientWidth || 128, h = cv.clientHeight || 160;
  if(!w || !h) return;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const c = cv.getContext('2d'); c.scale(dpr, dpr);
  const r = rng((kind.charCodeAt(0) * 977) + (cwIndex || 0) * 31 + 7);

  c.fillStyle = cw.base; c.fillRect(0, 0, w, h);

  if(kind === 'flake'){
    const n = Math.round(w * h / 150);
    for(let i = 0; i < n; i++){
      const x = r() * w, y = r() * h, s = 4 + r() * 7, a = r() * Math.PI;
      c.save(); c.translate(x, y); c.rotate(a);
      c.fillStyle = cw.chips[Math.floor(r() * cw.chips.length)];
      c.globalAlpha = .55 + r() * .45;
      c.beginPath();
      c.moveTo(-s/2, -s/2.6); c.lineTo(s/2, -s/2); c.lineTo(s/2.2, s/2.4); c.lineTo(-s/2.3, s/2);
      c.closePath(); c.fill(); c.restore();
    }
  } else if(kind === 'quartz' || kind === 'traffic'){
    const n = Math.round(w * h / (kind === 'traffic' ? 26 : 18));
    for(let i = 0; i < n; i++){
      c.beginPath();
      c.arc(r() * w, r() * h, (kind === 'traffic' ? .7 : 1) + r() * 2.1, 0, 6.2832);
      c.fillStyle = cw.chips[Math.floor(r() * cw.chips.length)];
      c.globalAlpha = .5 + r() * .5; c.fill();
    }
  } else if(kind === 'cementitious'){
    for(let i = 0; i < w * h / 9; i++){
      c.fillStyle = r() > .5 ? '#FFFFFF' : '#000000';
      c.globalAlpha = .012 + r() * .045;
      c.fillRect(r() * w, r() * h, 1.4, 1.4);
    }
    c.globalAlpha = .10;
    for(let i = 0; i < 14; i++){
      c.beginPath(); c.arc(r() * w, r() * h, 14 + r() * 34, 0, 6.2832);
      c.fillStyle = r() > .5 ? '#FFFFFF' : '#4A463F'; c.fill();
    }
  } else { /* smooth — pigmented gloss */
    const g = c.createLinearGradient(0, 0, w * .5, h);
    g.addColorStop(0, 'rgba(255,255,255,.20)'); g.addColorStop(.55, 'rgba(255,255,255,0)');
    g.addColorStop(1, 'rgba(0,0,0,.16)');
    c.globalAlpha = 1; c.fillStyle = g; c.fillRect(0, 0, w, h);
    c.save(); c.translate(w * .62, -h * .1); c.rotate(.38);
    const sh = c.createLinearGradient(0, 0, 0, h * 1.4);
    sh.addColorStop(0, 'rgba(255,255,255,.16)'); sh.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = sh; c.fillRect(0, 0, w * .5, h * 1.4); c.restore();
  }
  c.globalAlpha = 1;
}

/* paints every [data-art="kind|colourway"] canvas inside root */
function mountArt(root){
  if(!root) return;
  root.querySelectorAll('canvas[data-art]').forEach(cv => {
    if(cv._painted) return; cv._painted = 1;
    const [kind, idx] = cv.dataset.art.split('|');
    requestAnimationFrame(() => paintFinish(cv, kind, parseInt(idx || '0', 10)));
  });
}
function art(kind, idx, cls, style){
  return '<canvas data-art="'+esc(kind)+'|'+(idx||0)+'"'+(cls?' class="'+cls+'"':'')+
         (style?' style="'+style+'"':'')+' aria-hidden="true"></canvas>';
}
function systemFinish(sys){ return sys.finish || 'smooth'; }
</script>

<script>
/* ---------------------------------------------------- CALCULATOR (steps) */
function calcSteps(){ return state.calc.preset ? ['calcArea','calcSet'] : ['calcArea','calcTarget','pick','calcSet']; }
function stepHead(name){
  const steps = calcSteps(), i = Math.max(0, steps.indexOf(name)), n = steps.length;
  return '<div class="progressline"><i style="width:'+Math.round((i+1)/n*100)+'%"></i></div>'+
         '<div class="pad" style="padding-top:14px"><div class="eyebrow">'+
         t('sel.step')+' '+(i+1)+' '+t('sel.of')+' '+n+'</div></div>';
}
