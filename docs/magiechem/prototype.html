state.calc.dimsOpen = false;
state.calc.preset = false;
state.stacks.calculator = [{n:'calcArea'}];

const baseTitleFor = titleFor;
titleFor = function(r){
  if(r.n === 'calcArea')   return t('tab.calculator');
  if(r.n === 'calcTarget') return state.lang === 'fr' ? 'Cible' : 'Target';
  if(r.n === 'calcSet')    return t('calc.settings');
  if(r.n === 'finish')     return (FINISHES_ART.find(x => x.key === r.key) || {}).name || '';
  return baseTitleFor(r);
};

/* Groups the integer part for readability while the field is being typed in,
   and puts the caret back after the same digit. Never rewrites the value on
   focus — that fights text selection and IME. */
function groupNumber(clean){
  if(clean === '' || clean === '.') return clean;
  const [ip, dp] = clean.split('.');
  const grouped = Number(ip || 0).toLocaleString(state.lang === 'fr' ? 'fr-CA' : 'en-CA');
  return grouped + (dp !== undefined ? '.' + dp : '');
}
function formatAreaField(el){
  const before = el.value.slice(0, el.selectionStart).replace(/[^\d]/g,'').length;
  const clean = el.value.replace(/[^\d.]/g,'').replace(/(\..*)\./g,'$1');
  state.calc.area = clean;
  const out = groupNumber(clean);
  el.value = out;
  let i = 0, seen = 0;
  while(i < out.length && seen < before){ if(/\d/.test(out[i])) seen++; i++; }
  try{ el.setSelectionRange(i, i); }catch(e){}
}

function bindAreaInputs(){
  const a = document.getElementById('areaIn'), l = document.getElementById('lIn'), w = document.getElementById('wIn');
  const dock = () => { const b = document.querySelector('#dock .btn');
    if(b){ if(areaFt2() > 0) b.removeAttribute('disabled'); else b.setAttribute('disabled',''); } };
  if(a){
    a.addEventListener('input', () => {
      formatAreaField(a);
      state.calc.l = ''; state.calc.w = '';
      if(l) l.value = ''; if(w) w.value = '';
      dock();
    });
    if(state.calc.area) a.value = groupNumber(state.calc.area);
  }
  const dim = () => {
    state.calc.l = l.value.replace(/[^\d.]/g,''); state.calc.w = w.value.replace(/[^\d.]/g,'');
    const L = parseFloat(state.calc.l), W = parseFloat(state.calc.w);
    if(isFinite(L) && isFinite(W) && L > 0 && W > 0){
      state.calc.area = String(Math.round(L * W * 100) / 100);
      if(a) a.value = groupNumber(state.calc.area);
      dock();
    }
  };
  if(l) l.addEventListener('input', dim);
  if(w) w.addEventListener('input', dim);
}

const baseRender = render;
render = function(mode){
  baseRender(mode);
  const sc = document.getElementById('scroll');
  mountArt(sc);
  if(route().n === 'calcArea') bindAreaInputs();
};
const baseOpenSheet = openSheet;
openSheet = function(html){ baseOpenSheet(html); mountArt(document.getElementById('sheet')); };

const baseDoAction = doAction;
doAction = function(a){
  const i = a.indexOf(':'), k = i < 0 ? a : a.slice(0, i), v = i < 0 ? '' : a.slice(i + 1);
  const A = {
    dims(){ state.calc.dimsOpen = true; render(); },
    finish(){ push({n:'finish', key:v}); },
    areanext(){
      /* skip only when the target came with us from a product or system screen,
         so the "step 1 of n" count and the actual path always agree */
      if(state.calc.preset && state.calc.target && state.calc.target.id) push({n:'calcSet'});
      else push({n:'calcTarget'});
    },
    target(){
      if(!state.calc.target || state.calc.target.kind !== v){ state.calc.target = {kind:v, id:null}; state.calc.overrides = {}; }
      render();
      setTimeout(() => push({n:'pick', key:v, q:''}), 90);
    },
    settarget(){
      const [kind, id] = v.split('|');
      state.calc.target = {kind, id}; state.calc.overrides = {};
      if(kind === 'system') touchSystem(id); else touchProduct(id);
      const st = stack();
      if(st[st.length-1].n === 'pick') st.pop();
      st.push({n:'calcSet'}); render('push');
    },
    pickagain(){ push({n:'pick', key:(state.calc.target||{}).kind || 'system', q:''}); },
    editarea(){ state.stacks.calculator = [{n:'calcArea'}]; render('pop'); },
    waste(){ state.calc.waste = +v;
      document.querySelectorAll('.vals button').forEach(b =>
        b.classList.toggle('on', b.dataset.act === 'waste:'+v));
      refreshCalc();
    },
    calcsystem(){
      touchSystem(v); closeSheet();
      state.calc.target = {kind:'system', id:v}; state.calc.overrides = {}; state.calc.preset = true;
      resetTo('calculator', {n:'calcArea'});
    },
    calcproduct(){
      touchProduct(v);
      state.calc.target = {kind:'product', id:v}; state.calc.overrides = {}; state.calc.preset = true;
      resetTo('calculator', {n:'calcArea'});
    },
    go(){
      if(v === 'calc'){
        /* an entry point starts the flow at step 1; the tab bar still resumes
           wherever the calculator was left. Entered values are kept either way. */
        state.calc.preset = false; resetTo('calculator', {n:'calcArea'});
      }
      else baseDoAction(a);
    },
    reopen(){
      const p = state.projects.find(x => x.id === v); if(!p) return;
      state.calc.area = String(p.area); state.calc.unit = p.unit; state.calc.waste = p.waste;
      state.calc.target = {kind:'system', id:p.systemId}; state.calc.preset = true;
      state.calc.overrides = JSON.parse(JSON.stringify(p.overrides || {}));
      resetTo('calculator', {n:'calcArea'}); push({n:'calcSet'}); push({n:'results'});
    }
  };
  if(A[k]) return A[k]();
  return baseDoAction(a);
};

function projMeta(p){

}
function nSystems(n){
  return n + ' ' + (state.lang === 'fr' ? (n === 1 ? 'système' : 'systèmes') : (n === 1 ? 'system' : 'systems'));
}
/* a stable colourway per system, so two smooth systems don't look identical */
function finishIdx(id, kind){
  let h = 0; for(let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
  return h % ((COLOURWAYS[kind] || COLOURWAYS.smooth).length);
}
function sysArt(sys){
  const k = systemFinish(sys);
  return art(k, finishIdx(sys.id, k));
}

  h += '<div class="sp24"></div><div class="pad"><button class="row" data-act="go:selector" '+

  const label = type === 'app'
    ? (APPLICATIONS.find(a => a.key === key) || {}).name
    : (PERFORMANCE.find(p => p.key === key) || {}).name;

    : (s.tags.env.includes(key) || s.tags.perf.includes(key) || s.tags.finish.includes(key)));
  let h = '<div class="pad"><h1 class="lt">'+esc(label)+'</h1><p class="lt-sub">'+nSystems(list.length)+'</p></div>';
  h += '<div class="sp16"></div>'+list.map(s =>
    '<button class="obj" data-act="system:'+s.id+'">'+
      '<span class="thumb" style="width:46px;height:46px">'+sysArt(s)+'</span>'+
      '<span style="flex:1;min-width:0">'+
        '<span class="ot" style="display:block;font-size:16.5px">'+esc(s.name)+'</span>'+
        '<span class="om" style="display:block;margin-top:2px">'+esc(s.variant)+' · '+esc(s.thickness)+'</span>'+
      '</span>'+chev+'</button>').join('')+'<div class="sp44"></div>';
  return {html:h, title:label};
};
render();
</script>
